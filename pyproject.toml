# SPDX-License-Identifier: AGPL-3.0-or-later
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-dictate"
version = "0.1.0"
description = "System-wide, fully-local voice-to-text for macOS (Apple Silicon) using NVIDIA Parakeet via MLX."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Naval Monga" }]
keywords = ["dictation", "speech-to-text", "asr", "parakeet", "mlx", "macos", "voice"]
classifiers = [
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "parakeet-mlx",
    "sounddevice",
    "pynput",
    "numpy",
    "rumps",  # menu bar status icon; the app degrades to headless without it
]

[project.optional-dependencies]
dev = ["watchdog", "pytest", "ruff"]  # watchdog: ./dev.sh auto-restart; pytest/ruff: CI

[tool.pytest.ini_options]
pythonpath = ["."]  # import top-level handlers.py from tests/

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# pycodestyle errors/warnings, pyflakes, pyupgrade, flake8-bugbear.
# isort is intentionally omitted to preserve the grouped import layout.
select = ["E", "W", "F", "UP", "B"]

[project.urls]
Homepage = "https://github.com/heaphq/py-parakeet"
Source = "https://github.com/heaphq/py-parakeet"

[project.scripts]
parakeet-dictate = "parakeet_dictate:main"

[tool.setuptools]
# Flat single-file modules (kept flat so handlers.py hot-reload stays simple).
py-modules = ["parakeet_dictate", "handlers"]
