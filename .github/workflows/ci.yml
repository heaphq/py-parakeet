name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest  # Apple Silicon; matches the tool's target platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Enough to import parakeet_dictate and run the pure-logic tests (state
      # machine, handlers) — sounddevice ships a bundled PortAudio, so no brew
      # step. Still no MLX model download; parakeet_mlx is imported lazily.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pynput numpy sounddevice pytest ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Compile check
        run: |
          python -c "import py_compile as c; \
            c.compile('parakeet_dictate.py', doraise=True); \
            c.compile('handlers.py', doraise=True)"

      - name: Run tests
        run: pytest -q
